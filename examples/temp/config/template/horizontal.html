<!doctype html>
<html>
  <head>
    <meta http-equiv="X-UA-Compatible" content="IE=EDGE" />
    <meta name="referrer" content="no-referrer" />
    <meta charset="UTF-8" />
    <meta
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"
      name="viewport"
    />
    <style>
      .global_loading {
        background: transparent;
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        width: 100%;
        box-sizing: border-box;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 30px;
      }

      .global_img {
        width: 30px;
        height: 30px;
        animation: rotate-img 1.5s linear infinite reverse;
      }

      @keyframes rotate-img {
        from {
          transform: rotate(360deg);
        }

        to {
          transform: rotate(0deg);
        }
      }
    </style>
    <script>
      (function (a, b) {
        var init = true;
        function getUrlParam(name) {
          var reg = new RegExp('(^|&)' + name + '=([^&]*)(&|$)');
          var r = window.location.search.substr(1).match(reg);
          if (r != null) return decodeURI(r[2]);
          return null;
        }
        var theme = getUrlParam('theme');
        if (theme === 'dark') {
          console.log(document.documentElement);
          a.documentElement.className = 'black';
        }
        if (theme === 'light') {
          a.documentElement.className = 'white';
        }
        // 页面自适应脚本
        var c = a.documentElement,
          d = 'orientationchange' in window ? 'orientationchange' : 'resize',
          e = (window.recalc = function () {
            var a = c.clientHeight;
            if (a) {
              var fontsize = Math.floor(100 * (a / 750));
              if (init) {
                c.style.fontSize = fontsize + 'px';
                init = false;
              }
            }
          });
        a.addEventListener && (b.addEventListener(d, e, !1), a.addEventListener('DOMContentLoaded', e, !1));
      })(document, window);
    </script>
  </head>
  <body>
    <div id="root">
      <div class="global_loading">
        <img class="global_img" src="/static/loading.svg" alt="" />
      </div>
    </div>
  </body>
</html>
