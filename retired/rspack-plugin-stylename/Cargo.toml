[package]
name = "rspack-plugin-stylename"
version = "0.1.0"
edition = "2021"
authors = ["Roc"]
description = "SWC plugin for transforming styleName to className in JSX"
license = "ISC"

[lib]
crate-type = ["cdylib"]

[dependencies]
swc_core = { version = "55.0.0", features = ["ecma_plugin_transform"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
